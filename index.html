<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPLAT — Legal</title>
    <style>
        :root {
            --bg: #f4f7f0;
            --surface: #e8efe2;
            --text: #36432f;
            --heading: #232c1e;
            --accent: #4e7a3e;
            --link: #3f6a31;
            --border: #c3d2bc;
            --muted: #6e7f66;
            --hover: #dde8d5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: var(--bg);
            min-height: 100vh;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            color: var(--text);
            line-height: 1.7;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: var(--accent);
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
            letter-spacing: 0.02em;
        }
        .subtitle {
            color: var(--text);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        a.doc-link {
            display: block;
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 0 4px 4px 0;
            color: var(--link);
            text-decoration: none;
            padding: 1rem 1.25rem;
            font-size: 1.05rem;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        a.doc-link:hover {
            background: var(--hover);
            border-color: var(--accent);
        }
        .footer {
            margin-top: 2.5rem;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .footer a { color: var(--link); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1f16;
                --surface: #242b1f;
                --text: #c6d2bc;
                --heading: #e8efe2;
                --accent: #9dc17e;
                --link: #9dc17e;
                --border: #333c2c;
                --muted: #8b9a82;
                --hover: #2d3627;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>SPLAT: Block Puzzle</h1>
    <p class="subtitle">Legal Documents</p>

    <div class="links">
        <a class="doc-link" href="privacy-policy.html">Privacy Policy</a>
        <a class="doc-link" href="terms-of-service.html">Terms of Service</a>
        <a class="doc-link" href="data-deletion.html">Data Deletion</a>
        <a class="doc-link" href="third-party-notices.html">Third-Party Notices</a>
    </div>

    <div class="footer">
        <p>&copy; 2026 Leonid Korsakov</p>
        <p><a href="mailto:support-komandakycto@proton.me">support-komandakycto@proton.me</a></p>
    </div>
</div>
</body>
</html>
